<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-lg p-4">
                <h3 class="text-center">Đăng nhập</h3>
                <form th:action="@{/api/v1/auth/login}" method="post">
                    <div class="mb-3">
                        <label for="email" class="form-label">Tên đăng nhập</label>
                        <input type="text" class="form-control" id="email" name="email" placeholder="Nhập tên đăng nhập" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Mật khẩu</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Nhập mật khẩu" required>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Đăng nhập</button>
                    </div>
                </form>
                <div class="mt-3 text-center">
                    <span>Chưa có tài khoản?</span> <a th:href="@{/register}">Đăng ký</a>
                </div>
                <div th:if="${param.error}" class="alert alert-danger text-center mt-3" role="alert">
                    Sai tên đăng nhập hoặc mật khẩu
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
